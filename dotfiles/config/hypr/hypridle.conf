# Idle management. https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on   # turn screen back on after wake
}

# Dim/lower backlight after 2.5 min, restore on activity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock the screen after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off the display after 6 min
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
