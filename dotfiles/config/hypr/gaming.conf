# Gaming rules for Hyprland. Sourced from hyprland.conf.
#
# Context for these choices: the built-in panel is 1920x1080 @ 60 Hz with no
# VRR, so there are no high-refresh or adaptive-sync tricks to be had here.
# What's left that actually matters is (a) keeping compositor effects off the
# game's frames and (b) not letting the desktop interrupt a controller session.

# Tearing has to be permitted globally before any individual window can opt in
# with the `immediate` rule. On its own this line changes nothing — no window
# tears until something below asks for it.
general {
    allow_tearing = true
}


#####################
### STEAM CLIENT  ###
#####################
# The Steam client is an XWayland app and its dropdown menus are borderless
# windows with an empty title. Without these two rules the menus close the
# instant you move the pointer toward them.
windowrule = stayfocused, class:^(steam)$, title:^()$
windowrule = minsize 1 1, class:^(steam)$, title:^()$

# Steam's utility windows are dialogs, not tiles.
windowrule = float, class:^(steam)$, title:^(Friends List)$
windowrule = float, class:^(steam)$, title:^(Steam Settings)$
windowrule = float, class:^(steam)$, title:^(Screenshot Uploader)$
windowrule = float, class:^(steam)$, title:^(Special Offers)$
windowrule = float, class:^(steam)$, title:^(Steam - Self Updater)$
windowrule = float, title:^(Steam Big Picture Mode)$


#####################
###    GAMES      ###
#####################
# Strip compositor effects from anything fullscreen. Blur and shadow on a
# fullscreen window are pure waste — they composite over frames nobody can see
# the edges of — and they block Hyprland from handing the buffer straight to
# the display controller (direct scanout).
windowrule = noblur, fullscreen:1
windowrule = noshadow, fullscreen:1
windowrule = norounding, fullscreen:1
windowrule = noanim, fullscreen:1

# Keep the screen alive during controller-only play. This is scoped to
# fullscreen windows and to the game's own process, so your normal hypridle
# timings (dim 2.5 min / lock 5 min / DPMS 6 min) still apply everywhere else.
windowrule = idleinhibit fullscreen, fullscreen:1

# Content-type hint, so the driver and compositor can pick a latency-oriented
# profile rather than a power-saving one.
windowrule = content game, fullscreen:1

# Steam launches each game with a class of steam_app_<appid>.
windowrule = noblur, class:^(steam_app_\d+)$
windowrule = noanim, class:^(steam_app_\d+)$
windowrule = idleinhibit always, class:^(steam_app_\d+)$
windowrule = content game, class:^(steam_app_\d+)$

# Tearing: trades a visible horizontal seam for roughly one frame less input
# latency (~16 ms on a 60 Hz panel). Worth it in fast shooters, distracting in
# slower games — so it's opt-in. Uncomment the blanket rule if you'd rather
# have the latency everywhere, or add per-game lines using the appid.
# windowrule = immediate, fullscreen:1
# windowrule = immediate, class:^(steam_app_1091500)$   # e.g. Cyberpunk 2077

# Keep a game rendering after you alt-tab away from it. Useful for anything
# online where pausing isn't an option; costs GPU time otherwise, so remove
# this line if you'd rather backgrounded games go idle.
# windowrule = renderunfocused, class:^(steam_app_\d+)$


#####################
###   GAMESCOPE   ###
#####################
# gamescope is a nested micro-compositor. When it's running it owns the whole
# output, so let it go straight to fullscreen and hold off idle entirely.
windowrule = fullscreen, class:^(gamescope)$
windowrule = idleinhibit always, class:^(gamescope)$
windowrule = noblur, class:^(gamescope)$
windowrule = noanim, class:^(gamescope)$
