# Shared Rust compile cache (sccache, from 45-cli-tools.sh), for every
# process in the user session. sccache can't cache incremental builds, so
# incremental compilation is off; opt out per shell with
#   RUSTC_WRAPPER= CARGO_INCREMENTAL=1 cargo build
CARGO_INCREMENTAL=0
SCCACHE_DIR=__HOME__/.cache/sccache
SCCACHE_CACHE_SIZE=40G
