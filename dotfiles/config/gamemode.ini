### gamemode — activate per-game via Steam launch options:  gamemoderun %command%
### Check it engaged while a game runs:  gamemoded -s

[general]
# Nice priority boost for the game process (1-20).
renice=10

# CPU governor to hold while a game runs. amd_pstate is in "active" mode on this
# machine and already sits on "performance", so this is belt-and-braces rather
# than an actual change. defaultgov is deliberately unset so gamemode restores
# whatever was in place beforehand.
desiredgov=performance

# SCHED_ISO where the kernel supports it. "auto" only engages when there are
# cores to spare; with 16 threads here it will.
softrealtime=auto

# Only inhibits the screensaver for the lifetime of the game process — your
# normal hypridle policy is untouched.
inhibit_screensaver=1

[gpu]
# Deliberately off. The 780M shares its power budget with the CPU cores, and
# amdgpu's own governor manages that tradeoff better than a fixed clock offset.
# Forcing clocks here typically costs performance on an APU rather than gaining it.
apply_gpu_optimisations=0
