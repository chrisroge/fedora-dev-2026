### MangoHud — in-game performance overlay
### Enable per-game via Steam launch options:  mangohud %command%
### Toggle in-game:  Right_Shift + F12      Start/stop a log:  Left_Shift + F2

## What to show
fps
fps_color_change
frametime
frame_timing

gpu_stats
gpu_temp
gpu_load_change
gpu_core_clock
vram

cpu_stats
cpu_temp
cpu_load_change
cpu_mhz

ram
swap
throttling_status
battery

## Context — tells you at a glance whether gamemode actually engaged and
## which Proton/driver the game landed on.
gamemode
vulkan_driver
wine
resolution

## Appearance
position=top-left
font_size=20
background_alpha=0.4
round_corners=6

## Keybinds
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

## Logging
output_folder=__HOME__/.local/share/MangoHud-logs
log_duration=60
autostart_log=0
